<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Butter Bliss Bakery - Business Card</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;500;600;700;800&family=Pacifico&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="business-card">

        <!-- =================================
             LEFT SIDE
        ================================== -->

        <section class="left-side">

            <!-- Decorative top dots -->
            <div class="top-decoration">
                ✦
            </div>


            <!-- LOGO -->
            <div class="logo-container">

                <img src="assets/butter-bliss-logo.png"
                     alt="Butter Bliss Bakery Logo"
                     class="bakery-logo">

            </div>


            <!-- QR CODE -->
            <div class="qr-section">

                <div class="qr-box">

                    <img src="assets/qr-code.png"
                         alt="Butter Bliss Bakery QR Code"
                         class="qr-code">


                    <!-- Scan Me -->
                    <div class="scan-label">
                        SCAN ME
                    </div>

                </div>


                <!-- Website -->
                <p class="website-text">
                    Visit our website!
                </p>

            </div>


            <!-- Decorative bottom -->
            <div class="bottom-decoration">
                ✿ &nbsp; ✦ &nbsp; ❀
            </div>

        </section>



        <!-- =================================
             RIGHT SIDE
        ================================== -->

        <section class="right-side">


            <!-- Decorative circles -->
            <div class="decor-circle circle-one"></div>
            <div class="decor-circle circle-two"></div>


            <!-- NAME -->
            <div class="name-section">

                <div class="name-line"></div>

                <h1>
                    Myuee Ellie Silva
                </h1>

                <h2>
                    OWNER
                </h2>

            </div>



            <!-- CONTACT INFORMATION -->
            <div class="contact-section">


                <!-- PHONE -->
                <div class="contact-item">

                    <div class="icon">

                        <svg viewBox="0 0 24 24">

                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2
                            19.79 19.79 0 0 1-8.63-3.07
                            19.5 19.5 0 0 1-6-6
                            19.79 19.79 0 0 1-3.07-8.67
                            A2 2 0 0 1 4.11 2h3
                            a2 2 0 0 1 2 1.72
                            12.84 12.84 0 0 0 .7 2.81
                            2 2 0 0 1-.45 2.11L8.09 9.91
                            a16 16 0 0 0 6 6l1.27-1.27
                            a2 2 0 0 1 2.11-.45
                            12.84 12.84 0 0 0 2.81.7
                            A2 2 0 0 1 22 16.92z">
                            </path>

                        </svg>

                    </div>


                    <p>
                        09852325847
                    </p>

                </div>



                <!-- EMAIL -->
                <div class="contact-item">

                    <div class="icon">

                        <svg viewBox="0 0 24 24">

                            <rect x="3"
                                  y="5"
                                  width="18"
                                  height="14"
                                  rx="2">
                            </rect>

                            <polyline points="3,7 12,13 21,7">
                            </polyline>

                        </svg>

                    </div>


                    <p>
                        butterblissll@gmail.com
                    </p>

                </div>



                <!-- ADDRESS -->
                <div class="contact-item address">

                    <div class="icon">

                        <svg viewBox="0 0 24 24">

                            <path d="M21 10c0 7-9 12-9 12S3 17 3 10
                            a9 9 0 1 1 18 0z">
                            </path>

                            <circle cx="12"
                                    cy="10"
                                    r="3">
                            </circle>

                        </svg>

                    </div>


                    <p>
                        Baritua St. Poblacion, Lupon<br>
                        Davao Oriental
                    </p>

                </div>



                <!-- FACEBOOK -->
                <div class="contact-item">

                    <div class="icon facebook">

                        <svg viewBox="0 0 24 24">

                            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7
                            a1 1 0 0 1 1-1h3z">
                            </path>

                        </svg>

                    </div>


                    <p>
                        Butter Bliss Bakery
                    </p>

                </div>


            </div>


            <!-- Bottom decorative text -->
            <div class="right-decoration">
                SWEET • FRESH • DELICIOUS
            </div>


        </section>

    </main>


</body>

</html>
